name: Check release metadata consistency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release metadata versions
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(jq -r '.version' package.json)
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          MARKETPLACE_METADATA_VERSION=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          MARKETPLACE_PLUGIN_VERSION=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          SITE_VERSION=$(jq -r '.version' site/assets/data/latest-update.json)

          README_VERSION=$(grep -m1 -oE 'Version:** `([0-9]+\.[0-9]+\.[0-9]+)`' README.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          RELEASE_VERSION=$(grep -m1 -oE '^# Release [0-9]+\.[0-9]+\.[0-9]+' RELEASE.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          printf '%s\n' \
            "package.json=$PACKAGE_VERSION" \
            ".claude-plugin/plugin.json=$PLUGIN_VERSION" \
            ".claude-plugin/marketplace.json metadata=$MARKETPLACE_METADATA_VERSION" \
            ".claude-plugin/marketplace.json plugin=$MARKETPLACE_PLUGIN_VERSION" \
            "site/assets/data/latest-update.json=$SITE_VERSION" \
            "README.md=$README_VERSION" \
            "RELEASE.md=$RELEASE_VERSION"

          for version in \
            "$PLUGIN_VERSION" \
            "$MARKETPLACE_METADATA_VERSION" \
            "$MARKETPLACE_PLUGIN_VERSION" \
            "$SITE_VERSION" \
            "$README_VERSION" \
            "$RELEASE_VERSION"; do
            if [ "$version" != "$PACKAGE_VERSION" ]; then
              echo "Release metadata mismatch: expected $PACKAGE_VERSION, found $version" >&2
              exit 1
            fi
          done

          echo "Release metadata is consistent at $PACKAGE_VERSION"
