name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate JSON
        run: |
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool package.json >/dev/null
          python -m json.tool hooks/hooks.json >/dev/null
          python -m json.tool opencode.json >/dev/null
          python -m json.tool site/assets/data/latest-update.json >/dev/null
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py
      - name: Run full regression suite
        run: |
          set -euo pipefail
          test_count=0
          for test_file in tests/test_*.py; do
            echo "::group::$test_file"
            python "$test_file"
            echo "::endgroup::"
            test_count=$((test_count + 1))
          done
          if [ "$test_count" -eq 0 ]; then
            echo "No tests/test_*.py files were found" >&2
            exit 1
          fi
          echo "Executed $test_count regression test files"
      - name: Run canonical pre-commit validation
        run: |
          bash -n .githooks/pre-commit
          chmod +x .githooks/pre-commit hooks/validate-linux-admin.sh hooks/validate-universal-contract.sh
          .githooks/pre-commit
